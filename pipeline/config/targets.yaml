# Moon and Mars targets whose conditions the Earth analogs should reproduce.
# lon_e is east-positive, 0..360, in the body-fixed frame of that world.
# radius_km is the analysis window used for the target "fingerprint".
# coord_quality: verified = read from the source page; approx = to be refined.
version: 1

defaults:
  moon: {radius_km: 15}
  mars: {radius_km: 50}

targets:

  # ------------------------------------------------------------------ Moon
  - id: shackleton_ridge
    world: moon
    name: Shackleton - de Gerlache connecting ridge
    name_uk: Хребет Шеклтон - де Жерлаш
    lat: -89.684
    lon_e: 196.739
    radius_km: 15
    role: base_site          # main Moon Base location
    mvp: true
    coord_quality: verified
    note: Junction of the ridge with the Shackleton rim; the ridge is about 14 km long.
    source: https://lroc.im-ldi.com/images/1247

  - id: shackleton_crater
    world: moon
    name: Shackleton crater
    name_uk: Кратер Шеклтон
    lat: -89.67
    lon_e: 129.78
    radius_km: 10
    role: cold_trap_reference   # permanently shadowed floor next to the base site
    mvp: false
    coord_quality: verified
    note: Diameter 20.9 km.
    source: https://planetarynames.wr.usgs.gov/Feature/5450

  - id: de_gerlache_crater
    world: moon
    name: de Gerlache crater
    name_uk: Кратер де Жерлаш
    lat: -88.5
    lon_e: 272.9          # 87.1 W
    radius_km: 16
    role: landing_region_context
    mvp: false
    coord_quality: verified
    note: Diameter 32.4 km. The Artemis III region "de Gerlache Rim 2" lies on its rim.
    source: https://en.wikipedia.org/wiki/De_Gerlache_(crater)

  - id: mons_mouton
    world: moon
    name: Mons Mouton
    name_uk: Гора Мутон
    lat: -84.6
    lon_e: 31.0
    radius_km: 40
    role: landing_region     # Artemis III regions "Mons Mouton" and "Mons Mouton Plateau"
    mvp: true
    coord_quality: verified
    note: About 100 km wide, 6 km from base to peak.
    source: https://en.wikipedia.org/wiki/Mons_Mouton

  - id: malapert
    world: moon
    name: Malapert crater and massif
    name_uk: Кратер і масив Малаперт
    lat: -84.9
    lon_e: 12.9
    radius_km: 35
    role: landing_region     # Artemis III region "Malapert Massif"
    mvp: false
    coord_quality: approx
    note: >-
      Coordinates are of the crater (diameter 69 km). The massif is on its south-western
      rim, peak near longitude 0, about 5 km high. Refine with the NASA region map.
    source: https://en.wikipedia.org/wiki/Malapert_(crater)

  # ------------------------------------------------------------------ Mars
  - id: jezero
    world: mars
    name: Jezero crater (Perseverance landing site)
    name_uk: Кратер Єзеро
    lat: 18.44
    lon_e: 77.45
    radius_km: 40
    role: landing_site
    mvp: true
    coord_quality: verified
    note: Crater diameter 45 km; ancient lake and river delta.
    source: https://wiki.riteme.site/wiki/Octavia_E._Butler_Landing

  - id: arcadia_planitia
    world: mars
    name: Arcadia Planitia (mid-latitude ground ice)
    name_uk: Рівнина Аркадія
    lat: 47.2
    lon_e: 184.3
    radius_km: 100
    role: ice_region
    mvp: true
    coord_quality: verified
    note: Centre of a plain that spans 33.9N to 64.2N; widespread excess ground ice.
    source: https://wiki.riteme.site/wiki/Arcadia_Planitia

  - id: gale
    world: mars
    name: Gale crater (Curiosity landing site)
    name_uk: Кратер Гейл
    lat: -4.59
    lon_e: 137.44
    radius_km: 50
    role: landing_site
    mvp: false
    coord_quality: verified
    source: https://ode.rsl.wustl.edu/mars/pagehelp/Content/Missions_Instruments/Landing_Sites.htm

  - id: phoenix
    world: mars
    name: Phoenix landing site (northern plains, ground ice)
    name_uk: Місце посадки Phoenix
    lat: 68.22
    lon_e: 234.25
    radius_km: 50
    role: ice_region
    mvp: false
    coord_quality: verified
    source: https://ode.rsl.wustl.edu/mars/pagehelp/Content/Missions_Instruments/Landing_Sites.htm

  - id: viking2_utopia
    world: mars
    name: Viking 2 landing site, Utopia Planitia
    name_uk: Місце посадки Viking 2, рівнина Утопія
    lat: 47.668
    lon_e: 134.280
    radius_km: 50
    role: landing_site
    mvp: false
    coord_quality: verified
    source: https://ode.rsl.wustl.edu/mars/pagehelp/Content/Missions_Instruments/Landing_Sites.htm

  - id: meridiani
    world: mars
    name: Meridiani Planum (Opportunity landing site)
    name_uk: Плато Меридіана
    lat: -1.9462
    lon_e: 354.4734
    radius_km: 50
    role: landing_site
    mvp: false
    coord_quality: verified
    source: https://ode.rsl.wustl.edu/mars/pagehelp/Content/Missions_Instruments/Landing_Sites.htm

  - id: mawrth_vallis
    world: mars
    name: Mawrth Vallis (candidate landing site)
    name_uk: Долина Маурт
    lat: 23.99
    lon_e: 341.04
    radius_km: 50
    role: landing_site
    mvp: false
    coord_quality: verified
    source: https://ode.rsl.wustl.edu/mars/pagehelp/Content/Missions_Instruments/Landing_Sites.htm
