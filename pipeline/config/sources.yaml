  - id: earth_mod11c3
    world: earth
    title: MODIS/Terra Land Surface Temperature, monthly, 0.05 degree (MOD11C3)
    official_resource: NASA Earthdata Search
    agency: NASA
    access: earthdata_login
    provider: earthaccess
    short_name: MOD11C3
    version: "061"
    temporal: year      # 12 monthly granules of the chosen year
    dest: data/raw/earth/modis_lst
    format: hdf4        # read with pyhdf; the rasterio wheel for Windows has no HDF4 driver
    used_for: [thermal]
    citation: >-
      Wan, Z., Hook, S., and Hulley, G. (2021). MODIS/Terra Land Surface Temperature/Emissivity
      Monthly L3 Global 0.05Deg CMG V061. NASA EOSDIS LP DAAC. doi:10.5067/MODIS/MOD11C3.061
    license: NASA EOSDIS open data policy

