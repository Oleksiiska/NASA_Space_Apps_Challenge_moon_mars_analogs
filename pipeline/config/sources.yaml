  - id: earth_power_climatology
    world: earth
    title: NASA POWER climatology at points (air temperature, precipitation, humidity, sun)
    official_resource: none (NASA, outside the challenge list)
    agency: NASA
    access: open
    provider: power_api
    base_url: https://power.larc.nasa.gov/api/temporal/climatology/point
