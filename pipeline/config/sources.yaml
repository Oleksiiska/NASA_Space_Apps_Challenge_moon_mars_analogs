# Data manifest: which files come from which official challenge resource.
# File names and byte sizes of the PDS files were read from the PDS directory
# listings on 2026-11-13. `dest` is relative to the project root.
#
# access:   open | earthdata_login | account
# provider: pds | http | earthaccess | power_api | copdem_aws
version: 1
checked: "2026-11-13"

datasets:

  # ------------------------------------------------------------------ Moon
  - id: moon_lola_polar_dem
    world: moon
    title: LRO LOLA GDR, south polar elevation (240 m, 80 m, 20 m)
    official_resource: NASA Lunar Reconnaissance Orbiter (PDS Geosciences)
    agency: NASA
    access: open
    provider: pds
    base_url: https://pds-geosciences.wustl.edu/lro/lro-l-lola-3-rdr-v1/lrolol_1xxx/data/lola_gdr/polar/img/
    dest: data/raw/moon/lola
    format: pds3_img   # int16 little-endian; height_m = DN * 0.5 above a 1737.4 km sphere
    projection: south polar stereographic, pole at the image centre, longitude 0 up
    used_for: [terrain]
    files:
      - {name: ldem_75s_240m.img, bytes: 29062688, label: ldem_75s_240m.lbl}    # 75S..pole, 3812 x 3812
      - {name: ldem_80s_80m.img, bytes: 115520000, label: ldem_80s_80m.lbl}     # 80S..pole
      - {name: ldem_875s_20m.img, bytes: 115034112, label: ldem_875s_20m.lbl}   # 87.5S..pole
    citation: >-
      Smith, D. E., et al. (2017). Summary of the results from the Lunar Orbiter Laser
      Altimeter after seven years in lunar orbit. Icarus, 283, 70-91. Data set
      LRO-L-LOLA-4-GDR-V1.0, NASA Planetary Data System.
    license: NASA PDS, public

  - id: moon_lola_polar_slope_roughness
    world: moon
    title: LRO LOLA GDR, south polar slope and roughness maps
    official_resource: NASA Lunar Reconnaissance Orbiter (PDS Geosciences)
    agency: NASA
    access: open
    provider: pds
    base_url: https://pds-geosciences.wustl.edu/lro/lro-l-lola-3-rdr-v1/lrolol_1xxx/data/lola_gdr/polar/img/
    dest: data/raw/moon/lola
    format: pds3_img
    used_for: [terrain_crosscheck]
    files:
      - {name: ldsm_75s_240m.img, bytes: 29062688, label: ldsm_75s_240m.lbl}
      - {name: ldsm_85s_40m.img, bytes: 115034112, label: ldsm_85s_40m.lbl}
      - {name: ldrm_75s_240m.img, bytes: 29062688, label: ldrm_75s_240m.lbl}
    citation: Same as moon_lola_polar_dem.
    license: NASA PDS, public

  - id: moon_diviner_prp
    world: moon
    title: LRO Diviner Polar Resource Product, south pole
    official_resource: NASA LRO Diviner Lunar Data (PDS Geosciences)
    agency: NASA
    access: open
    provider: pds
    base_url: https://pds-geosciences.wustl.edu/lro/urn-nasa-pds-lro_diviner_derived1/data_derived_prp/
    dest: data/raw/moon/diviner
    format: pds_fixed_table   # 210-byte records, first record is the header, 2,880,000 rows
    used_for: [thermal, ice]
    files:
      - {name: dlre_prp_south.tab, bytes: 604800210, label: dlre_prp_south.lbl}
    columns:   # 1-based byte offsets from the PDS4 label dlre_prp_south.xml
      tri_clon: {start: 127, length: 15, unit: degree}
      tri_clat: {start: 144, length: 15, unit: degree}
      tri_calt: {start: 161, length: 15, unit: km}
      temp_avg: {start: 178, length: 8, unit: K}     # annual mean at 2 cm depth
      temp_max: {start: 188, length: 8, unit: K}     # annual maximum surface temperature
      ice_depth: {start: 198, length: 11, unit: m}   # 0 = ice stable at the surface, -999 = deeper than 2.87 m
    citation: >-
      Paige, D. A., et al. (2010). Diviner Lunar Radiometer observations of cold traps in
      the Moon's south polar region. Science, 330, 479-482. Diviner derived products,
      NASA Planetary Data System.
    license: NASA PDS, public

  # ------------------------------------------------------------------ Mars
  - id: mars_mola_megdr_64
    world: mars
    title: MGS MOLA MEGDR topography, 64 pixels per degree (926 m)
    official_resource: NASA Planetary Data System (PDS)
    agency: NASA
    access: open
    provider: pds
    base_url: https://pds-geosciences.wustl.edu/mgs/urn-nasa-pds-mgs_mola_topography_derived/meg064/
    dest: data/raw/mars/mola
    format: pds3_img   # int16 big-endian, metres above the areoid, simple cylindrical
    used_for: [terrain]
    files:   # name = top latitude + left longitude of the tile; each tile is 90 x 180 degrees
      - {name: megt90n000gb.img, bytes: 132710400, label: megt90n000gb.lbl}
      - {name: megt90n180gb.img, bytes: 132710400, label: megt90n180gb.lbl}
      - {name: megt00n000gb.img, bytes: 132710400, label: megt00n000gb.lbl}
      - {name: megt00n180gb.img, bytes: 132710400, label: megt00n180gb.lbl}
    citation: >-
      Smith, D., Neumann, G., Arvidson, R. E., Guinness, E. A., and Slavney, S. (2003).
      Mars Global Surveyor Laser Altimeter Mission Experiment Gridded Data Record,
      MGS-M-MOLA-5-MEGDR-L3-V1.0, NASA Planetary Data System.
    license: NASA PDS, public

  - id: mars_mola_megdr_16
    world: mars
    title: MGS MOLA MEGDR topography, 16 pixels per degree (3.7 km), global quick-look
    official_resource: NASA Planetary Data System (PDS)
    agency: NASA
    access: open
    provider: pds
    base_url: https://pds-geosciences.wustl.edu/mgs/urn-nasa-pds-mgs_mola_topography_derived/meg016/
    dest: data/raw/mars/mola
    format: pds3_img
    used_for: [terrain_quicklook]
    files:
      - {name: megt90n000eb.img, bytes: 33177600, label: megt90n000eb.lbl}   # 5760 x 2880
    citation: Same as mars_mola_megdr_64.
    license: NASA PDS, public

  - id: mars_grs_h2o
    world: mars
    title: Mars Odyssey GRS element concentration map, H2O (5 degree bins, smoothed)
    official_resource: NASA Planetary Data System (PDS)
    agency: NASA
    access: open
    provider: pds
    base_url: https://pds-geosciences.wustl.edu/ody/ody-m-grs-5-elements-v1/odgm_xxxx/data/smoothed/
    dest: data/raw/mars/grs
    format: pds_ascii_table   # 2592 rows: latitude, longitude, weight percent, sigma; 9999.999 = no data
    used_for: [ice]
    files:
      - {name: h2o_sr_5x5.tab, bytes: 186624, label: h2o_sr_5x5.lbl}
    # Fe, Si, K, Th and Cl maps sit in the same folder (fe_, si_, k_, th_, cl_ prefixes).
    citation: >-
      Boynton, W. V., et al. (2007). Concentration of H, Si, Cl, K, Fe, and Th in the low-
      and mid-latitude regions of Mars. J. Geophys. Res., 112, E12S99. Data set
      ODY-M-GRS-5-ELEMENTS-V1.0, NASA Planetary Data System.
    license: NASA PDS, public

  # ----------------------------------------------------------------- Earth
  - id: earth_naturalearth_land
    world: earth
    title: Natural Earth 1:50m land and glaciated areas (land mask of the grid)
    official_resource: none (auxiliary, public domain)
    agency: Natural Earth
    access: open
    provider: http
    base_url: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/
    dest: data/raw/earth/naturalearth
    format: geojson
    used_for: [land_mask]
    files:
      - {name: ne_50m_land.geojson, bytes: 1636166}
      - {name: ne_50m_glaciated_areas.geojson, bytes: 512453}
    citation: Made with Natural Earth. Free vector and raster map data @ naturalearthdata.com.
    license: Public domain

  - id: earth_gvp_volcanoes
    world: earth
    title: Smithsonian Global Volcanism Program, Volcanoes of the World (Holocene and Pleistocene volcanoes)
    official_resource: none (auxiliary context layer)
    agency: Smithsonian Institution
    access: open
    provider: http
    dest: data/raw/earth/context
    format: geojson
    used_for: [volcanic]
    files:
      - name: gvp_holocene.geojson
        url: "https://webservices.volcano.si.edu/geoserver/GVP-VOTW/ows?service=WFS&version=2.0.0&request=GetFeature&typeName=GVP-VOTW:Smithsonian_VOTW_Holocene_Volcanoes&outputFormat=application/json"
      - name: gvp_pleistocene.geojson
        url: "https://webservices.volcano.si.edu/geoserver/GVP-VOTW/ows?service=WFS&version=2.0.0&request=GetFeature&typeName=GVP-VOTW:Smithsonian_VOTW_Pleistocene_Volcanoes&outputFormat=application/json"
    citation: >-
      Global Volcanism Program (2024). Volcanoes of the World (v. 5.2.x). Smithsonian Institution.
      doi:10.5479/si.GVP.VOTW5-2024.5.2
    license: Smithsonian terms of use; cite the Global Volcanism Program

  - id: earth_impact_structures
    world: earth
    title: Confirmed impact structures on Earth (Wikipedia list based on the Earth Impact Database, and Wikidata)
    official_resource: none (auxiliary context layer)
    agency: Wikipedia / Wikidata
    access: open
    provider: http
    dest: data/raw/earth/context
    format: wikitext, sparql-json
    used_for: [impact]
    files:
      - name: impacts_wikipedia.wiki
        url: "https://en.wikipedia.org/w/index.php?title=List_of_impact_structures_on_Earth&action=raw"
      - name: impacts_wikidata.json
        url: "https://query.wikidata.org/sparql?format=json&query=SELECT%20%3Fitem%20%3FitemLabel%20%3Flat%20%3Flon%20WHERE%20%7B%20%3Fitem%20wdt%3AP31%20wd%3AQ55818%20.%20%3Fitem%20p%3AP625%2Fpsv%3AP625%20%3Fc%20.%20%3Fc%20wikibase%3AgeoLatitude%20%3Flat%20%3B%20wikibase%3AgeoLongitude%20%3Flon%20%3B%20wikibase%3AgeoGlobe%20wd%3AQ2%20.%20SERVICE%20wikibase%3Alabel%20%7B%20bd%3AserviceParam%20wikibase%3Alanguage%20%22en%22.%20%7D%20%7D"
    citation: >-
      Wikipedia contributors, "List of impact structures on Earth" (CC BY-SA 4.0), compiled from the Earth Impact
      Database (Planetary and Space Science Centre, University of New Brunswick); Wikidata (CC0), items that are
      instances of "impact crater" (Q55818) with coordinates on Earth.
    license: CC BY-SA 4.0 (Wikipedia), CC0 (Wikidata)

  - id: earth_srtmgl30
