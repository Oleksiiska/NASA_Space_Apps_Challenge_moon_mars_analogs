name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "pipeline[geo,dev]"
      - name: Tests (no downloads needed)
        run: python -m pytest -q pipeline
      - name: Scoring, validation and web page from the committed data
        run: python -m analog_finder all
